<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="game2.css" />
  </head>
  <body>
    <header>
      <div>
        <h1 id="logo_name">
          k&nbsp;o&nbsp;t&nbsp;k&nbsp;a&nbsp;•&nbsp;l&nbsp;a
        </h1>
      </div>

      <nav>
        <a class="button_nav" href="index.html">HOME</a>
        <a class="button_nav" href="aboutme.html">ABOUT ME</a>
        <a class="button_nav" href="products.html">PRODUCTS</a>
        <a class="button_nav" href="game.html">KOTKA_GAME</a>

        <a class="button_nav" href="contact.html">CONTACT</a>
      </nav>
    </header>

    <main id="main-game">
      <article class="container_game">
        <h2 id="welcome">KOTKA_GAME2</h2>
        <p>use WASD to move and collect objects</p>
        <div class="score-time-container" id="st-container">
          <div id="score-container" class="st-table">
            <h3><span>S C O R E : </span></h3>
            <h3 id="score"><span id="score-value">0</span></h3>
          </div>
          <div id="time-container" class="st-table">
            <h3 id="time">
              <span>T I M E : </span><span id="time-value">60</span>
            </h3>
          </div>
        </div>
        <div class="game_container">
          <div class="game2">
            <div class="sliding-background"></div>
            <div id="game-over" class="game-over-screen">
              <div id="textGameOver" class="gameOverShown">
                <h2>GAME</h2>
                <h2>OVER</h2>
              </div>
              <div id="textPlayAgain" class="gameOverUnshown">
                <h2>PLAY</h2>
                <h2>AGAIN</h2>
              </div>
            </div>
            <div id="enemy">
              <img src="imgGame2/enemy1_1.gif" alt="" />
            </div>
            <div id="char1">
              <img
                id="tigerWalkNorth"
                src="imgGame2/tigerWalkNord-ezgif.gif"
                alt=""
              />
              <img
                id="tigerWalkSouth"
                src="imgGame2/tigerWalkSouth-ezgif.gif"
                alt=""
              />
              <img id="tigerWon" src="imgGame2/tigerWon1.gif" alt="" />
            </div>
          </div>
        </div>
      </article>
    </main>

    <footer>
      <div class="footer_container">
        <a id="instagram" class="button_footer" href="">INSTAGRAM</a>
        <a class="button_footer" href="">ETSY</a>
        <a class="button_footer" href="">DOLAP</a>
        <a id="imprint" class="button_footer" href="">IMPRINT</a>
      </div>
    </footer>
    <script src="game2.js"></script>
  </body>
</html>
